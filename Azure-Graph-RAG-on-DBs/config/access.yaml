#   In a real company, not everyone should see everything. For example:
#     - a branch manager sees only their own region's investors
#     - a distributor sees only their own transactions
#     - only the compliance team sees the personal-data columns
#   This file would list those rules, and the agent would add them to every
#   query before it runs.
#
# TODAY:
#   No code reads this file. Everyone who uses the demo sees all the data,
#   which is fine for synthetic data. There is nothing to fill in. Leave it
#   as it is.
#
# WHY KEEP AN EMPTY FILE:
#   It marks where the rules will go, so the next person to build this
#   knows it's planned and where to put it.
