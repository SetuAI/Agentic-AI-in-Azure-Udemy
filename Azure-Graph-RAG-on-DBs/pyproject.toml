[project]
name = "azure-fundgraph-rag-on-db"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "azure-monitor-opentelemetry>=1.8.10",
    "fastapi>=0.141.1",
    "langgraph>=1.2.11",
    "langsmith>=0.13.0",
    "numpy>=2.5.3",
    "openai>=3.16.2",
    "polars>=1.44.2",
    "psycopg[binary]>=3.3.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "sqlglot>=30.18.0",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
