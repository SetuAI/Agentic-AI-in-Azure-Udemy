<svg xmlns="http://www.w3.org/2000/svg" width="1620" height="1260" viewBox="0 0 1620 1260" font-family="Segoe UI, Helvetica, Arial, sans-serif"><defs><marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker><marker id="mt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0e7490"/></marker><marker id="mo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker><marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6d28d9"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#be185d"/></marker></defs><rect width="1620" height="1260" fill="#ffffff"/><text x="810.0" y="48" font-size="34" font-weight="700" text-anchor="middle" fill="#1e1e1e">Production Incident MCP Server on Azure</text><text x="810.0" y="80" font-size="18" font-weight="400" text-anchor="middle" fill="#555">3 stages: set up once, answer every question, evaluate</text><rect x="20" y="110" width="400" height="800" rx="18" fill="#e7eeff" stroke="#4a9eed" stroke-width="1.5"/><text x="40" y="142" font-size="22" font-weight="700" fill="#2563eb">STAGE 1: Setup (laptop, once)</text><rect x="50" y="170" width="340" height="80" rx="14" fill="#a5d8ff" fill-opacity="1" stroke="#4a9eed" stroke-width="2"/><text x="220.0" y="204.60000000000002" font-size="18" font-weight="700" text-anchor="middle" fill="#1e1e1e">generate.py</text><text x="220.0" y="228.00000000000003" font-size="18" font-weight="400" text-anchor="middle" fill="#1e1e1e">42 hours of logs + 4 incidents</text><polyline points="220,250 220,283" fill="none" stroke="#1e1e1e" stroke-width="2.2" marker-end="url(#mk)"/><rect x="50" y="285" width="340" height="70" rx="14" fill="#c3fae8" fill-opacity="1" stroke="#06b6d4" stroke-width="2"/><text x="220.0" y="314.6" font-size="18" font-weight="700" text-anchor="middle" fill="#1e1e1e">data/*.json</text><text x="220.0" y="338.0" font-size="18" font-weight="400" text-anchor="middle" fill="#1e1e1e">+ run_info.json</text><polyline points="220,355 220,388" fill="none" stroke="#1e1e1e" stroke-width="2.2" marker-end="url(#mk)"/><rect x="50" y="390" width="340" height="80" rx="14" fill="#a5d8ff" fill-opacity="1" stroke="#4a9eed" stroke-width="2"/><text x="220.0" y="424.6" font-size="18" font-weight="700" text-anchor="middle" fill="#1e1e1e">send_logs.py</text><text x="220.0" y="448.0" font-size="18" font-weight="400" text-anchor="middle" fill="#1e1e1e">uploads the logs</text><rect x="50" y="550" width="340" height="80" rx="14" fill="#c3fae8" fill-opacity="1" stroke="#06b6d4" stroke-width="2"/><text x="220.0" y="584.5999999999999" font-size="18" font-weight="700" text-anchor="middle" fill="#1e1e1e">postmortems/PM-*.md</text><text x="220.0" y="607.9999999999999" font-size="18" font-weight="400" text-anchor="middle" fill="#1e1e1e">8 old incident reports</text><polyline points="220,630 220,668" fill="none" stroke="#1e1e1e" stroke-width="2.2" marker-end="url(#mk)"/><rect x="50" y="670" width="340" height="80" rx="14" fill="#a5d8ff" fill-opacity="1" stroke="#4a9eed" stroke-width="2"/><text x="220.0" y="704.5999999999999" font-size="18" font-weight="700" text-anchor="middle" fill="#1e1e1e">build_index.py</text><text x="220.0" y="727.9999999999999" font-size="18" font-weight="400" text-anchor="middle" fill="#1e1e1e">builds the search index</text><rect x="50" y="800" width="340" height="80" rx="14" fill="#fff3bf" fill-opacity="1" stroke="#f59e0b" stroke-width="2"/><text x="220.0" y="834.9000000000001" font-size="17" font-weight="700" text-anchor="middle" fill="#1e1e1e">Signs in as app registration</text><text x="220.0" y="857.0000000000001" font-size="17" font-weight="400" text-anchor="middle" fill="#1e1e1e">incident-logs-loader (.env)</text><rect x="460" y="110" width="440" height="800" rx="18" fill="#e3f8e6" stroke="#22c55e" stroke-width="1.5"/><text x="480" y="142" font-size="22" font-weight="700" fill="#15803d">AZURE SERVICES</text><rect x="490" y="170" width="380" height="100" rx="14" fill="#c3fae8" fill-opacity="1" stroke="#06b6d4" stroke-width="2"/><text x="680.0" y="214.3" font-size="19" font-weight="700" text-anchor="middle" fill="#1e1e1e">Azure Log Analytics</text><text x="680.0" y="239.0" font-size="19" font-weight="400" text-anchor="middle" fill="#1e1e1e">AppLogs_CL + Deployments_CL</text><rect x="490" y="310" width="380" height="100" rx="14" fill="#c3fae8" fill-opacity="1" stroke="#06b6d4" stroke-width="2"/><text x="680.0" y="354.29999999999995" font-size="19" font-weight="700" text-anchor="middle" fill="#1e1e1e">Azure AI Search</text><text x="680.0" y="378.99999999999994" font-size="19" font-weight="400" text-anchor="middle" fill="#1e1e1e">index: postmortems</text><rect x="490" y="450" width="380" height="100" rx="14" fill="#ffd8a8" fill-opacity="1" stroke="#f59e0b" stroke-width="2"/><text x="680.0" y="494.29999999999995" font-size="19" font-weight="700" text-anchor="middle" fill="#1e1e1e">Azure AI Content Safety</text><text x="680.0" y="519.0" font-size="19" font-weight="400" text-anchor="middle" fill="#1e1e1e">Prompt Shields</text><rect x="490" y="590" width="380" height="120" rx="14" fill="#fff3bf" fill-opacity="1" stroke="#f59e0b" stroke-width="2"/><text x="680.0" y="631.9499999999999" font-size="19" font-weight="700" text-anchor="middle" fill="#1e1e1e">Microsoft Entra ID</text><text x="680.0" y="656.65" font-size="19" font-weight="400" text-anchor="middle" fill="#1e1e1e">sign-in with no keys</text><text x="680.0" y="681.3499999999999" font-size="19" font-weight="400" text-anchor="middle" fill="#1e1e1e">read-only roles on Azure</text><rect x="490" y="750" width="380" height="110" rx="14" fill="#eebefa" fill-opacity="1" stroke="#ec4899" stroke-width="2"/><text x="680.0" y="799.3" font-size="19" font-weight="700" text-anchor="middle" fill="#1e1e1e">Azure OpenAI gpt-5.1</text><text x="680.0" y="824.0" font-size="19" font-weight="400" text-anchor="middle" fill="#1e1e1e">(evaluation only)</text><polyline points="390,430 488,220" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#mb)"/><rect x="407.4" y="312.0" width="63.199999999999996" height="24" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1"/><text x="439.0" y="330.0" font-size="15" text-anchor="middle" fill="#2563eb">upload</text><polyline points="390,710 488,360" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#mb)"/><rect x="411.5" y="522.0" width="55.0" height="24" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1"/><text x="439.0" y="540.0" font-size="15" text-anchor="middle" fill="#2563eb">index</text><polyline points="390,840 488,650" fill="none" stroke="#b45309" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#mo)"/><rect x="403.3" y="732.0" width="71.39999999999999" height="24" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1"/><text x="439.0" y="750.0" font-size="15" text-anchor="middle" fill="#b45309">sign in</text><rect x="940" y="110" width="660" height="800" rx="18" fill="#efe9ff" stroke="#8b5cf6" stroke-width="1.5"/><text x="960" y="142" font-size="22" font-weight="700" fill="#6d28d9">STAGE 2: Every question</text><ellipse cx="1055" cy="200" rx="90" ry="35" fill="#a5d8ff" stroke="#4a9eed" stroke-width="2"/><text x="1055" y="207" font-size="20" font-weight="700" text-anchor="middle" fill="#1e1e1e">Engineer</text><polyline points="1145,200 1178,200" fill="none" stroke="#1e1e1e" stroke-width="2.2" marker-end="url(#mk)"/><rect x="1180" y="160" width="390" height="80" rx="14" fill="#a5d8ff" fill-opacity="1" stroke="#4a9eed" stroke-width="2"/><text x="1375.0" y="195.2" font-size="16" font-weight="700" text-anchor="middle" fill="#1e1e1e">AI app</text><text x="1375.0" y="216.0" font-size="16" font-weight="400" text-anchor="middle" fill="#1e1e1e">Claude Code / VS Code Copilot / Claude desktop</text><rect x="970" y="300" width="600" height="570" rx="16" fill="#f7f4ff" fill-opacity="1" stroke="#8b5cf6" stroke-width="2"/><text x="995" y="332" font-size="20" font-weight="700" text-anchor="start" fill="#6d28d9">MCP server on Azure App Service</text><polyline points="1460,240 1460,298" fill="none" stroke="#6d28d9" stroke-width="2.2" marker-end="url(#mp)"/><rect x="1391.5" y="257" width="137.0" height="24" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1"/><text x="1460" y="275" font-size="15" text-anchor="middle" fill="#6d28d9">tool call + key</text><polyline points="1290,298 1290,242" fill="none" stroke="#15803d" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#mg)"/><rect x="1242.0" y="257" width="96.0" height="24" rx="6" fill="#ffffff" stroke="#15803d" stroke-width="1"/><text x="1290" y="275" font-size="15" text-anchor="middle" fill="#15803d">safe facts</text><rect x="1000" y="350" width="540" height="55" rx="14" fill="#ffc9c9" fill-opacity="1" stroke="#ef4444" stroke-width="2"/><text x="1270.0" y="383.8" font-size="18" font-weight="400" text-anchor="middle" fill="#1e1e1e">1. API key check (wrong key = 401)</text><polyline points="1270,405 1270,423" fill="none" stroke="#1e1e1e" stroke-width="2.2" marker-end="url(#mk)"/><rect x="1000" y="425" width="540" height="55" rx="14" fill="#ffc9c9" fill-opacity="1" stroke="#ef4444" stroke-width="2"/><text x="1270.0" y="458.8" font-size="18" font-weight="400" text-anchor="middle" fill="#1e1e1e">2. Input checks: app name, times, request ID</text><polyline points="1270,480 1270,498" fill="none" stroke="#1e1e1e" stroke-width="2.2" marker-end="url(#mk)"/><rect x="1000" y="500" width="540" height="170" rx="14" fill="#b2f2bb" fill-opacity="1" stroke="#22c55e" stroke-width="2"/><text x="1270.0" y="546.75" font-size="17" font-weight="700" text-anchor="middle" fill="#1e1e1e">3. The 9 tools</text><text x="1270.0" y="568.85" font-size="17" font-weight="400" text-anchor="middle" fill="#1e1e1e">get_error_summary · find_root_service</text><text x="1270.0" y="590.95" font-size="17" font-weight="400" text-anchor="middle" fill="#1e1e1e">get_errors · what_changed · compare_periods</text><text x="1270.0" y="613.05" font-size="17" font-weight="400" text-anchor="middle" fill="#1e1e1e">trace_request · get_slow_endpoints</text><text x="1270.0" y="635.15" font-size="17" font-weight="400" text-anchor="middle" fill="#1e1e1e">search_postmortems · run_log_query (last resort)</text><polyline points="1270,670 1270,688" fill="none" stroke="#1e1e1e" stroke-width="2.2" marker-end="url(#mk)"/><rect x="1000" y="690" width="540" height="60" rx="14" fill="#ffd8a8" fill-opacity="1" stroke="#f59e0b" stroke-width="2"/><text x="1270.0" y="726.3" font-size="18" font-weight="400" text-anchor="middle" fill="#1e1e1e">4. Every log text checked by Prompt Shields</text><polyline points="1270,750 1270,768" fill="none" stroke="#1e1e1e" stroke-width="2.2" marker-end="url(#mk)"/><rect x="1000" y="770" width="540" height="80" rx="14" fill="#b2f2bb" fill-opacity="1" stroke="#22c55e" stroke-width="2"/><text x="1270.0" y="804.9000000000001" font-size="17" font-weight="400" text-anchor="middle" fill="#1e1e1e">attack → [removed]    unreachable → [hidden]</text><text x="1270.0" y="827.0000000000001" font-size="17" font-weight="400" text-anchor="middle" fill="#1e1e1e">the AI never sees unchecked text</text><polyline points="1000,550 872,225" fill="none" stroke="#0e7490" stroke-width="2.2" marker-end="url(#mt)"/><rect x="888.0" y="374.5" width="96.0" height="24" rx="6" fill="#ffffff" stroke="#0e7490" stroke-width="1"/><text x="936.0" y="392.5" font-size="15" text-anchor="middle" fill="#0e7490">KQL search</text><polyline points="1000,640 872,365" fill="none" stroke="#0e7490" stroke-width="2.2" marker-end="url(#mt)"/><rect x="904.4" y="489.5" width="63.199999999999996" height="24" rx="6" fill="#ffffff" stroke="#0e7490" stroke-width="1"/><text x="936.0" y="507.5" font-size="15" text-anchor="middle" fill="#0e7490">search</text><polyline points="1000,720 872,505" fill="none" stroke="#b45309" stroke-width="2.2" marker-end="url(#mo)"/><rect x="900.3" y="599.5" width="71.39999999999999" height="24" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1"/><text x="936.0" y="617.5" font-size="15" text-anchor="middle" fill="#b45309">attack?</text><polyline points="872,670 968,820" fill="none" stroke="#b45309" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#mo)"/><rect x="847.4" y="732.0" width="145.2" height="24" rx="6" fill="#ffffff" stroke="#b45309" stroke-width="1"/><text x="920.0" y="750.0" font-size="15" text-anchor="middle" fill="#b45309">managed identity</text><rect x="20" y="950" width="1580" height="280" rx="18" fill="#fde8f0" stroke="#ec4899" stroke-width="1.5"/><text x="40" y="982" font-size="22" font-weight="700" fill="#be185d">STAGE 3: Evaluation (laptop)</text><rect x="50" y="1010" width="250" height="90" rx="14" fill="#fff3bf" fill-opacity="1" stroke="#f59e0b" stroke-width="2"/><text x="175.0" y="1049.9" font-size="17" font-weight="700" text-anchor="middle" fill="#1e1e1e">golden_dataset.json</text><text x="175.0" y="1072.0" font-size="17" font-weight="400" text-anchor="middle" fill="#1e1e1e">24 questions + answers</text><polyline points="300,1055 348,1055" fill="none" stroke="#1e1e1e" stroke-width="2.2" marker-end="url(#mk)"/><rect x="350" y="1010" width="250" height="90" rx="14" fill="#a5d8ff" fill-opacity="1" stroke="#4a9eed" stroke-width="2"/><text x="475.0" y="1049.9" font-size="17" font-weight="700" text-anchor="middle" fill="#1e1e1e">run_eval.py</text><text x="475.0" y="1072.0" font-size="17" font-weight="400" text-anchor="middle" fill="#1e1e1e">each question 3 times</text><polyline points="600,1055 648,1055" fill="none" stroke="#1e1e1e" stroke-width="2.2" marker-end="url(#mk)"/><rect x="650" y="1010" width="260" height="90" rx="14" fill="#b2f2bb" fill-opacity="1" stroke="#22c55e" stroke-width="2"/><text x="780.0" y="1049.9" font-size="17" font-weight="700" text-anchor="middle" fill="#1e1e1e">scorers.py (Layer A)</text><text x="780.0" y="1072.0" font-size="17" font-weight="400" text-anchor="middle" fill="#1e1e1e">tools, inputs, facts</text><polyline points="910,1055 958,1055" fill="none" stroke="#1e1e1e" stroke-width="2.2" marker-end="url(#mk)"/><rect x="960" y="1010" width="260" height="90" rx="14" fill="#eebefa" fill-opacity="1" stroke="#ec4899" stroke-width="2"/><text x="1090.0" y="1049.9" font-size="17" font-weight="700" text-anchor="middle" fill="#1e1e1e">judge.py (Layer B)</text><text x="1090.0" y="1072.0" font-size="17" font-weight="400" text-anchor="middle" fill="#1e1e1e">correct? grounded?</text><polyline points="1220,1055 1268,1055" fill="none" stroke="#1e1e1e" stroke-width="2.2" marker-end="url(#mk)"/><rect x="1270" y="1010" width="300" height="90" rx="14" fill="#b2f2bb" fill-opacity="1" stroke="#22c55e" stroke-width="2"/><text x="1420.0" y="1049.9" font-size="17" font-weight="700" text-anchor="middle" fill="#1e1e1e">Report</text><text x="1420.0" y="1072.0" font-size="17" font-weight="400" text-anchor="middle" fill="#1e1e1e">pass@1 · pass^3 · injection = 0</text><rect x="350" y="1130" width="430" height="70" rx="14" fill="#ffd8a8" fill-opacity="1" stroke="#f59e0b" stroke-width="2"/><text x="565.0" y="1159.9" font-size="17" font-weight="700" text-anchor="middle" fill="#1e1e1e">shield_eval.py</text><text x="565.0" y="1182.0" font-size="17" font-weight="400" text-anchor="middle" fill="#1e1e1e">detection rate + false alarms</text><rect x="820" y="1130" width="430" height="70" rx="14" fill="#c3fae8" fill-opacity="1" stroke="#06b6d4" stroke-width="2"/><text x="1035.0" y="1159.9" font-size="17" font-weight="700" text-anchor="middle" fill="#1e1e1e">retrieval_eval.py</text><text x="1035.0" y="1182.0" font-size="17" font-weight="400" text-anchor="middle" fill="#1e1e1e">hit@1 · hit@3 · MRR</text><polyline points="460,1008 640,862" fill="none" stroke="#be185d" stroke-width="2.2" marker-end="url(#mr)"/><rect x="514.3" y="922.0" width="71.39999999999999" height="24" rx="6" fill="#ffffff" stroke="#be185d" stroke-width="1"/><text x="550.0" y="940.0" font-size="15" text-anchor="middle" fill="#be185d">gpt-5.1</text><polyline points="560,1008 1240,872" fill="none" stroke="#6d28d9" stroke-width="2.2" stroke-dasharray="7 6" marker-end="url(#mp)"/><rect x="791.8" y="922" width="276.4" height="24" rx="6" fill="#ffffff" stroke="#6d28d9" stroke-width="1"/><text x="930" y="940" font-size="15" text-anchor="middle" fill="#6d28d9">asks through the real MCP server</text></svg>